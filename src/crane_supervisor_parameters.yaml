# The freshness deadlines of wiki/control_architecture.md 5.3, one per input.
#
# **This file is where the numbers live, and it is the only place they live.**
# `SupervisorConfig::freshness_deadline` is an array sized by the `Input`
# registry and value-initialised to zero, and zero is not a deadline: an input
# that was never given one fails validate() and the node throws rather than
# publishing a status about a stream nobody is watching. A plausible struct
# default beside these four would be exactly how an input nobody configured goes
# on being judged by a number nobody chose.
#
# They are per input and not one global number because the inputs do not go
# stale at the same age: two come off the manager's 100 Hz cycle and two are
# 20 Hz contracts, so the healthy worst-case age of one is not the healthy
# worst-case age of another. None of them is a safety timing requirement -- by
# the time the remote's deadline expires the hardware chain has long since acted
# -- and what each number trades is a false alarm against how far the diagnosis
# lags the event.
crane_supervisor:
  pendulum_state_timeout:
    type: double
    default_value: 0.15
    read_only: true
    description: "Freshness deadline of Input::PendulumState: the longest age of
      the newest crane_msgs/PendulumState on /crane/pendulum_state that still
      counts as arriving, s. Past it the supervisor reports FAULT_STATE_HEALTH
      and says which of the staleness causes fired:
      wiki/control_architecture.md 5.3 allows no input to stop arriving without
      a defined consequence, and this deadline is what turns 'stopped' into that
      consequence for this input. Derived, not measured, and deliberately loose
      -- 100 Hz publication sampled at 20 Hz makes a healthy sample up to 60 ms
      old when it is read, and the worst control-cycle gap in the recorded
      machine data is a further 50.4 ms, so 150 ms clears a healthy stack
      without hiding a dead publisher for a human-perceptible time. It is a
      topic-level margin and is not the broadcaster's own
      health.max_measurement_age of 60 ms, which asks a different question one
      layer down. Read-only: a margin an operator can move underneath a running
      stream makes the status unreproducible."
    validation:
      bounds<>: [0.001, 10.0]
  remote_ctrl_timeout:
    type: double
    default_value: 0.25
    read_only: true
    description: "Freshness deadline of Input::RemoteCtrl: the longest age of the
      newest epsilon_crane_msgs/RemoteCtrlStates
      on /crane/remote_ctrl_states that still counts as arriving, s. Past it the
      signal is absent, and wiki/control_architecture.md 5.3 and 6.1 read absence
      of the stop signal as asserted rather than as released: a dead GPIO reader,
      a crashed driver and a released button must not look alike. It is the one
      input whose fault latches -- 6.1 asks the software to come back in a
      defined state, so /crane/clear_fault is what lowers it, while every other
      input clears its own fault as soon as it arrives again inside this
      margin. Derived --
      the topic is a 20 Hz contract sampled here at 20 Hz, so a healthy sample is
      up to 50 ms of publication period plus 50 ms of status period old when it
      is read, and the worst control-cycle gap in the recorded machine data adds
      a further 50.4 ms; 250 ms clears that 150 ms without letting a dead reader
      pass for a held button for longer than a quarter second. It is not a safety
      timing requirement: the hardware chain has already stopped the machine by
      the time this margin expires, and what the number trades is a false alarm
      against how far the diagnosis lags the event. Read-only, for the same
      reason the other margin is: a stop that an operator can widen from
      underneath a running stream is not one anybody can reason about."
    validation:
      bounds<>: [0.001, 10.0]
  controller_state_timeout:
    type: double
    default_value: 0.15
    read_only: true
    description: "Freshness deadline of Input::ControllerState: the longest age
      of the newest
      control_msgs/JointTrajectoryControllerState on /crane/controller_state that
      still counts as arriving, s. Past it the supervisor reports
      FAULT_STATE_HEALTH and says the tracking error is unmeasured, because a
      trajectory controller that stopped publishing is not a crane that is
      tracking perfectly and a tracking_error of zero must never be the only
      thing said about it (wiki/control_architecture.md 5.3). Derived exactly as
      pendulum_state_timeout is and to the same number: the controller publishes
      its state once per update(), ungated, inside the manager's 100 Hz cycle,
      and this node samples it at 20 Hz, so a healthy sample is up to 60 ms old
      when it is read and the worst control-cycle gap in the recorded machine
      data adds a further 50.4 ms. 150 ms clears the resulting 110 ms.
      Read-only, for the reason the other two margins are: a margin an operator
      can move underneath a running stream makes the status unreproducible."
    validation:
      bounds<>: [0.001, 10.0]
  controller_health_timeout:
    type: double
    default_value: 0.25
    read_only: true
    description: "Freshness deadline of Input::ControllerHealth: the longest age
      of the newest crane_msgs/VelocityControllerHealth
      on /crane/velocity_controller/health that still counts as arriving, s. Past
      it the supervisor reports FAULT_STATE_HEALTH and says the inner velocity
      loop's verdict on itself is unread rather than clear: a controller that
      stopped publishing must not be indistinguishable from one that is healthy
      and commissioned, and an uncommissioned axis reported to nobody is the
      state this stream exists to end (wiki/control_architecture.md 5.3,
      wiki/implementation/commissioning_prerequisites.md 2). Derived exactly as
      remote_ctrl_timeout is and to the same number, because the two streams have
      the same shape: /crane/velocity_controller/health is a 20 Hz contract --
      the 100 Hz loop decimates to the rate of its consumers -- sampled here at
      20 Hz, so a healthy sample is up to 50 ms of publication period plus 50 ms
      of status period old when it is read and the worst control-cycle gap in the
      recorded machine data adds a further 50.4 ms. 250 ms clears the resulting
      150 ms.
      Read-only, for the reason the other three margins are: a margin an operator
      can move underneath a running stream makes the status unreproducible."
    validation:
      bounds<>: [0.001, 10.0]
  # The sway duty of wiki/control_architecture.md 5 row 7. Four numbers, and
  # **every one of them is a design value rather than a measured one** -- each
  # description below says what it was derived from and what would replace it.
  #
  # Two facts fix the scale they all sit on and neither is invented here:
  #
  #   * The pendulum's own natural frequency is sqrt(g/l_tool) ~ 2 rad/s -- a
  #     period of 3.1 s -- the same number issue 016 derived the complementary
  #     filter's 0.2 rad/s crossover an order below.
  #   * The published rate's own noise is the identified
  #     pendulum_state_broadcaster health.velocity_variance of
  #     [3.0e-5, 2.0e-5] rad^2/s^2, i.e. 0.0055 rad/s on tip and 0.0045 on tilt,
  #     measured from the four recordings of CLAUDE.md Recorded machine data.
  #     That is a *floor*: a settle bound below a few of those sigmas is one a
  #     still crane could never be observed to meet.
  #
  # Reading that number here is not the same thing as consulting
  # velocity_covariance at runtime, which this supervisor deliberately does not
  # do. The published block is the identified noise of the sensor pair and is
  # therefore constant while the estimate is trusted; weighting a bound with it
  # would be a confidence-weighted test whose confidence never moves. Fixing the
  # floor of a design threshold is what the number is actually good for.
  #
  # The test is on the **rate** and not on the angle, for a reason that is not a
  # preference: the published angle is read out on the nominal hinge axes,
  # because the calibrated 2-D spline for the real double hinge needs calibration
  # data this workspace does not carry, so it carries an uncalibrated constant
  # offset -- and theta7_tilt_joint's limits are not centred on zero either. The
  # rate is composed from the two gyro readings through the known chain and
  # inherits none of that (wiki/system.md Measurement).
  #
  # One caveat worth knowing before these numbers are trusted on the machine: the
  # broadcaster's complementary filter subtracts a bias state bounded at
  # filter.max_gyro_bias = 0.05 rad/s from the rate it publishes, which is
  # *above* the settle bound below. The measured run-to-run bias of the
  # differenced pair is 0.0059 rad/s on tip and 0.0014 on tilt, an order under
  # that bound, so it does not arise today -- but a filter that ever ran its bias
  # state to the limit could hold the reported rate inside a settle bound the
  # real rate is outside.
  sway:
    dq_u_max:
      type: double_array
      default_value: [0.4, 0.4]
      read_only: true
      description: "The passive joint rate past which FAULT_SWAY is raised,
        rad/s, over [tip, tilt] -- the same index order crane_msgs/PendulumState
        publishes its arrays in. The fault names which of the two coordinates
        exceeded its own bound, because an operator watching the tool swing
        along the boom and one watching it swing across it are looking at two
        different things.
        **A design value, not a measured one.** It is the peak rate of a swing
        of about 0.2 rad amplitude at the pendulum's own 2 rad/s -- roughly 11
        degrees, half a metre of tool travel on a 2.5 m pendulum -- which is a
        swing worth putting in front of somebody rather than the amplitude at
        which anything breaks. **What would replace it** is the admissible sway
        bound of wiki/nomenclature.md 8 (q_sway_max), which the swing envelope
        of wiki/trajectory_planning.md 4.3 and the virtual working cell of
        wiki/control_architecture.md 5.1 will fix together at slice 5, converted
        to a rate through the measured period. Nothing in this workspace has
        that number yet, and a plausible one written here would be indexed by
        the same slice that ought to produce it. Read-only: a sway bound an
        operator can widen from underneath a running stream is not one anybody
        can reason about."
      validation:
        fixed_size<>: [2]
        element_bounds<>: [0.0, 100.0]
    dq_u_settled:
      type: double_array
      default_value: [0.04, 0.04]
      read_only: true
      description: "The passive joint rate at or below which a coordinate counts
        as calm, rad/s, over [tip, tilt]. Both coordinates have to be calm for
        the whole dwell below before the settled predicate reads *settled*.
        Strictly below dq_u_max, which validate() enforces: a settle bound at or
        above the fault bound would call a crane settled in the same cycle it
        reported the swing.
        **A design value, not a measured one**, and it is bracketed from both
        sides. From above: it is the peak rate of a swing of about 0.02 rad
        amplitude at 2 rad/s -- roughly 1 degree, some 50 mm of tool travel on a
        2.5 m pendulum, which is the order of a placement budget. From below: it
        is about 7 sigma of the identified rate noise on tip and 9 on tilt, so a
        crane that is genuinely still is observed to be still rather than
        chattering against its own sensor noise. The two coordinates carry the
        same number because they are two directions of one pendulum, and the
        array is per coordinate so that a later identification can split them
        without a schema change. **What would replace it** is a measurement of
        what a swing at contact actually costs in placement error -- a recording
        of a grip approach with the load swinging, which needs the machine and a
        human, exactly like merge gate (ii-b) and the slice 1b campaign
        (PRD 14). Read-only, for the reason dq_u_max is."
      validation:
        fixed_size<>: [2]
        element_bounds<>: [0.0, 100.0]
    settled_release_factor:
      type: double
      default_value: 1.5
      read_only: true
      description: "How much higher the rate has to climb to leave the settled
        state than to enter it, as a dimensionless factor on dq_u_settled. The
        hysteresis half of the anti-chatter rule: the dwell below stops the
        predicate flickering on the way in, and this stops one noise sample past
        the bound flickering it on the way out, which would otherwise cost a
        whole dwell to recover from at 20 Hz. 1.5 puts the release bound at 0.06
        rad/s, some 11 sigma of the identified rate noise, so a sample crossing
        it is a load that moved and not a sensor. A design value from that
        separation; **what would replace it** is the same recording that would
        replace dq_u_settled, since both are about the same distribution. 1.0
        disables the hysteresis and leaves the dwell as the only guard, which is
        a legitimate configuration and is why the lower bound is 1.0 rather than
        something above it. Read-only, for the reason the bounds are."
      validation:
        bounds<>: [1.0, 10.0]
    settle_dwell:
      type: double
      default_value: 2.0
      read_only: true
      description: "How long both coordinates have to stay calm before the
        settled predicate reads *settled*, s. It is not a smoothing constant: it
        is the window that has to be long enough to have contained a rate peak.
        A pendulum's rate passes through zero twice a period, so a window shorter
        than half a period can sit on a turning point and see a swing at its
        slowest -- at 2 rad/s that half period is pi/2 = 1.57 s, and 2.0 s clears
        it. At the 20 Hz status rate that is 40 consecutive cycles, which is also
        what makes the predicate unable to chatter. **A design value**, derived
        from the sqrt(g/l_tool) ~ 2 rad/s of wiki/control_architecture.md 4.1 and
        issue 016's filter crossover; **what would replace it** is the period
        measured on the machine, which is not one number -- l_tool changes with
        telescope extension and with the tool -- so the honest replacement is the
        longest period over the working range, from a recording that carries a
        free swing. The recordings this workspace has were not taken for that.
        Read-only, for the reason the bounds are."
      validation:
        bounds<>: [0.001, 60.0]
  joints:
    type: string_array
    default_value:
      - theta1_slewing_joint
      - theta2_boom_joint
      - theta3_arm_joint
      - q4_big_telescope
      - theta8_rotator_joint
      - q9_left_rail_joint
    read_only: true
    description: "URDF names of the six actuated joints, as ROS 2 Interfaces 3.1
      spells them and 3.2 fixes the set. This is the list tracking_tolerance
      below is keyed on, and the names the trajectory controller reports in
      joint_names -- axes are paired by name and never by index, because the
      controller's ordering is its own. It is a list of names and not of numbers:
      nothing about the tolerance itself is stated here. Read-only, and fixed at
      n_a = 6, because the actuated set is a property of the machine."
    validation:
      unique<>: null
      fixed_size<>: [6]
  tracking_tolerance:
    __map_joints:
      dq_a:
        type: double
        default_value: .NAN
        description: "The per-axis velocity-tracking tolerance, rad/s on the four
          angles and m/s on the two lengths. **One number, now four consumers**
          (PRD 6 and 10): the seam clamp in crane_velocity_controller, the MPC's
          constraint margin, the D4 acceptance measure, and FAULT_TRACKING here.
          It is declared with a NaN default and is never given a value in this
          package's own configuration: the value lives in
          crane_control/config/tracking_tolerance.yaml, whose node key is the
          wildcard so that every consumer reads the same six rows out of the same
          file and they cannot drift apart. The number does not exist yet -- all
          six rows in that file are negative and say so -- and it comes from merge
          gate (ii-b) or from the identification campaign, both human-only, because
          mock hardware mirrors commands into states exactly and the tracking error
          there is identically zero. A value that is not finite and positive is not
          a tolerance: that axis raises no FAULT_TRACKING, the supervisor warns once
          at configuration and names the axis and the owner of the missing number,
          and tracking_error goes on being reported as a measurement. A fabricated
          default would be worse than the gap."
  deadman_button:
    type: int
    default_value: 12
    read_only: true
    description: "Which of the twelve booleans of
      epsilon_crane_msgs/RemoteCtrlStates is the operator deadman of
      wiki/control_architecture.md 6.2. The default is read from the retained
      stack, not inferred from the number: epsilon_crane_behavior_tree's approval
      gate returns msg.button12 in
      src/plugins/condition/check_user_approval.cpp and in
      include/epsilon_crane_behavior_tree/plugins/decorator/get_user_approval.hpp,
      whose comment says 'RemoteCtrlStates::button12 has to be pressed and held';
      the manual-control TUI defines KEYCODE_BUTTON12 as 0x7A -- the z key -- in
      timber_crane_manual_control/timber_crane_tui/src/remote_ctrl.cpp, which is
      the key 6.2 names as the simulated deadman; and the simulation's remote
      publisher sets button12 to approve in
      epsilon_crane_bringup_sim/test/remote_ctrl_publisher.cpp. gpio_controller
      copies the twelve booleans off the state interfaces in order and names none
      of them the deadman, so it fixes the wire index and the approval gate fixes
      the meaning. Configuration rather than a constant because it is a property
      of a remote's wiring, which the architecture does not own; read-only
      because changing which button stops the machine underneath a running
      supervisor is not a runtime adjustment."
    validation:
      bounds<>: [1, 12]
