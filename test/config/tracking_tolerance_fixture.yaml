# Test-only overrides, in the exact shape of
# `crane_control/config/tracking_tolerance.yaml` — wildcard node key, the same
# six URDF joint names, the same `dq_a` key. Nothing here is machine
# configuration, and **none of these numbers is a tolerance for any machine.**
#
# The real file carries `-1.0` on all six rows and says in its own header why: a
# value that is not finite and positive is not a tolerance, and the number comes
# from merge gate (ii-b) or from the identification campaign, both human-only. No
# automated test in this workspace can produce it, because mock hardware mirrors
# commands into states exactly and the tracking error there is identically zero.
#
# What *is* automatable, and what this file exists for, is the mechanism: that
# the supervisor reads its six numbers out of a file in this shape rather than
# out of its own configuration, and that with a number in hand FAULT_TRACKING is
# raised per axis and names the axis. The values below are chosen only so that
# the assertions are meaningful — small enough that a velocity error injected by
# the test crosses them unambiguously, and different per axis so that a test
# that paired axes by index instead of by name would fail loudly.
#
# **Do not copy these into crane_control/config/tracking_tolerance.yaml.**
/**:
  ros__parameters:
    tracking_tolerance:
      theta1_slewing_joint: {dq_a: 0.01}   # rad/s -- fixture, not measured
      theta2_boom_joint: {dq_a: 0.02}      # rad/s -- fixture, not measured
      theta3_arm_joint: {dq_a: 0.03}       # rad/s -- fixture, not measured
      q4_big_telescope: {dq_a: 0.04}       # m/s   -- fixture, not measured
      theta8_rotator_joint: {dq_a: 0.05}   # rad/s -- fixture, not measured
      q9_left_rail_joint: {dq_a: 0.06}     # m/s   -- fixture, not measured
