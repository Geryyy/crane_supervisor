controller_manager:
  ros__parameters:
    update_rate: 100
    follow_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    manual_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController
    tool_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

follow_velocity_controller:
  ros__parameters:
    joints:
      - theta1_slewing_joint
      - theta2_boom_joint
      - theta3_arm_joint
      - q4_big_telescope
      - theta8_rotator_joint

manual_velocity_controller:
  ros__parameters:
    joints:
      - theta1_slewing_joint
      - theta2_boom_joint
      - theta3_arm_joint
      - q4_big_telescope
      - theta8_rotator_joint

tool_velocity_controller:
  ros__parameters:
    joints:
      - q9_left_rail_joint
